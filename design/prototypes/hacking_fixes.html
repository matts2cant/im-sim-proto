<title>Hacking Fixes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: the 1280x720 game frame scaled to fit, as in the Tab interface mockup. Two overlays: a
   computer (Halcyon OS: login, Mail, Files, Security) and the deck (Map, Icebreaker). Palette: the
   Tab interface's slate and amber for the frame, the terminal's teal for the screens. */
:root {
  color-scheme: dark;
  --page: #07090b;
  --world-a: #1a2026; --world-b: #0b0e11;
  --panel: rgba(13, 18, 21, 0.95); --panel-2: #12191d; --cell: #0f1417;
  --line: rgba(140, 158, 168, 0.35); --line-strong: rgba(140, 158, 168, 0.6);
  --fg: #e4eaee; --caption: #9eb8c2; --dim: #66808a;
  --amber: #ffd14d; --ok: #4fd36a; --warn: #e8c547; --bad: #e5534b;
  --os-bg: #071211; --os-panel: #0b1a19; --os-line: rgba(77, 191, 168, 0.45);
  --teal: #8cf2d9; --teal-text: #d1f2e6; --teal-dim: #7fa8a3; --online: #73f299; --offline: #575c5c; --alert: #ffb840; --self: #73d9ff;
  --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--page); color: var(--fg); font: 14px var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.mockbar { width: 100%; max-width: 1280px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--caption); font-size: 12px; }
.mockbar strong { color: var(--fg); font: 600 14px var(--font-head); margin-right: 6px; }
.mockbar button, .mockbar select { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.mockbar button.on { border-color: var(--amber); color: var(--amber); }
.mockbar .sep { flex: 1; }
.frame-wrap { width: 100%; max-width: 1280px; position: relative; }
.frame-wrap::before { content: ""; display: block; padding-top: 56.25%; }
.frame { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; outline: none; }
.world { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(255,220,160,0.10), transparent 45%), linear-gradient(180deg, var(--world-a) 0%, #14191e 55%, var(--world-b) 56%, #101418 100%); }
.world .wall { position: absolute; left: 0; right: 0; top: 18%; height: 38%; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 120px), repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 60px); }
.world .guard { position: absolute; bottom: 30%; width: 34px; height: 110px; left: -60px; animation: patrol 20s linear infinite; }
.world .guard::before { content: ""; position: absolute; left: 6px; top: 0; width: 22px; height: 22px; background: #c79d78; border-radius: 3px; }
.world .guard::after { content: ""; position: absolute; left: 0; top: 24px; width: 34px; height: 86px; background: #1d2e52; border-radius: 3px; }
@keyframes patrol { 0% { left: -60px; } 50% { left: 1300px; } 100% { left: -60px; } }
@media (prefers-reduced-motion: reduce) { .world .guard { animation: none; left: 75%; } }
.dim { position: absolute; inset: 0; background: rgba(4, 6, 8, 0.55); }

/* Overlay shell (shared by the computer and the deck) */
.shell { position: absolute; left: 7.5%; top: 7.5%; width: 85%; height: 85%; background: var(--os-bg); border: 1px solid var(--os-line); border-radius: 6px; display: grid; grid-template-rows: auto 1fr; box-shadow: 0 20px 60px rgba(0,0,0,0.6); color: var(--teal-text); overflow: hidden; }
.bar { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-bottom: 1px solid var(--os-line); background: var(--os-panel); font: 12px var(--font-mono); }
.bar .title { font: 600 14px var(--font-head); color: var(--teal); letter-spacing: 0.02em; }
.bar .meta { color: var(--teal-dim); }
.bar .grow { flex: 1; }
.close-btn { width: 34px; height: 28px; font: 600 15px var(--font-ui); color: var(--teal-dim); background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
.close-btn:hover { color: var(--bad); border-color: rgba(229, 83, 75, 0.5); }
.trace { display: flex; align-items: center; gap: 8px; }
.trace .tb { width: 120px; height: 8px; background: #031010; border: 1px solid var(--os-line); position: relative; }
.trace .tb > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--alert); }
.trace.hot .tb > i { background: var(--bad); }
.trace .lbl { color: var(--teal-dim); }
.body { min-height: 0; position: relative; }
.btn { font: 600 12px var(--font-ui); color: var(--teal-text); background: #0c2220; border: 1px solid var(--os-line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { border-color: var(--teal); color: var(--teal); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
h2 { font: 700 18px var(--font-head); margin: 0 0 6px; color: var(--teal); }
h3 { font: 600 11px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal-dim); margin: 16px 0 8px; }
h3:first-child { margin-top: 0; }
p { margin: 0 0 10px; line-height: 1.5; max-width: 64ch; }
.muted { color: var(--teal-dim); }
.assist { font: 12px var(--font-mono); color: var(--self); border: 1px dashed rgba(115, 217, 255, 0.5); border-radius: 4px; padding: 4px 8px; display: inline-block; }
.assist::before { content: "Computer skill · "; color: var(--teal-dim); }
.future { font-size: 12px; color: var(--teal-dim); border: 1px dashed var(--os-line); border-radius: 4px; padding: 6px 10px; }
input.field { font: 14px var(--font-mono); color: var(--teal-text); background: #031010; border: 1px solid var(--os-line); border-radius: 4px; padding: 8px 10px; width: 260px; }
input.field:focus { outline: 1px solid var(--teal); }
.toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: var(--fg); font: 13px var(--font-mono); padding: 6px 14px; border-radius: 4px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 30; }
.toast.on { opacity: 1; }

/* Login */
.login { position: absolute; inset: 0; display: grid; place-items: center; }
.login .card { width: 420px; border: 1px solid var(--os-line); background: var(--os-panel); border-radius: 6px; padding: 26px; display: grid; gap: 12px; }
.login .os { font: 700 22px var(--font-head); color: var(--teal); letter-spacing: 0.04em; }
.login label { display: grid; gap: 4px; font: 12px var(--font-mono); color: var(--teal-dim); }
.fill { display: grid; gap: 6px; border-top: 1px solid var(--os-line); padding-top: 12px; }
.fill .row { display: flex; justify-content: space-between; align-items: center; font: 13px var(--font-mono); }
.err { color: var(--bad); font: 12px var(--font-mono); min-height: 16px; }

/* Desktop */
.desk { position: absolute; inset: 0; display: grid; grid-template-columns: 96px 1fr; }
.dock { border-right: 1px solid var(--os-line); padding: 14px 8px; display: grid; gap: 10px; align-content: start; background: var(--os-panel); }
.app { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--teal-text); font: 12px var(--font-ui); cursor: pointer; }
.app svg { width: 30px; height: 30px; }
.app:hover { border-color: var(--os-line); }
.app.on { border-color: var(--teal); background: rgba(140, 242, 217, 0.06); }
.dock .who { margin-top: 18px; font: 11px var(--font-mono); color: var(--teal-dim); text-align: center; line-height: 1.5; }
.win { min-height: 0; display: grid; }
.cols { display: grid; min-height: 0; height: 100%; }
.col { min-height: 0; overflow: auto; padding: 16px 18px; }
.col + .col { border-left: 1px solid var(--os-line); }
.list { display: grid; gap: 4px; align-content: start; }
.list button { text-align: left; background: none; border: 1px solid transparent; border-radius: 4px; padding: 8px 10px; cursor: pointer; color: var(--teal-text); font: 13px var(--font-ui); display: grid; gap: 2px; }
.list button:hover { border-color: var(--os-line); }
.list button.on { border-color: var(--teal); background: rgba(140, 242, 217, 0.06); }
.list small { color: var(--teal-dim); font: 11px var(--font-mono); }
.reader { font-size: 14px; line-height: 1.6; background: rgba(140, 242, 217, 0.03); border: 1px solid var(--os-line); border-radius: 4px; padding: 14px 16px; max-width: 64ch; white-space: pre-wrap; }
.learned { margin-top: 10px; font: 12px var(--font-mono); color: var(--teal-dim); }
.learned b { color: var(--amber); }

/* Security app */
.grp { font: 600 11px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal-dim); margin: 14px 0 6px; }
.grp:first-child { margin-top: 0; }
.dev { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; background: none; border: 1px solid transparent; border-radius: 4px; padding: 7px 8px; cursor: pointer; color: var(--teal-text); font: 13px var(--font-ui); }
.dev:hover { border-color: var(--os-line); }
.dev.on { border-color: var(--teal); background: rgba(140, 242, 217, 0.06); }
.dev svg { width: 22px; height: 22px; }
.dot { font: 11px var(--font-mono); }
.s-online { color: var(--online); } .s-disabled { color: var(--bad); } .s-offline { color: var(--offline); } .s-alert { color: var(--alert); }
.view { width: 100%; max-width: 520px; aspect-ratio: 16 / 9; border: 1px solid var(--os-line); background: linear-gradient(180deg, #1d2629, #0d1113 60%, #151a1b); position: relative; overflow: hidden; margin-bottom: 12px; }
.view .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(140,242,217,0.04) 0 1px, transparent 1px 3px); }
.view .lbl { position: absolute; left: 8px; top: 6px; font: 11px var(--font-mono); color: var(--teal); }
.view .rec { position: absolute; right: 8px; top: 6px; font: 11px var(--font-mono); color: var(--bad); }
.view.dark { background: #050707; }
.view .shape { position: absolute; bottom: 18%; width: 60px; height: 40px; background: #3b2c1c; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; margin-bottom: 12px; }
.kv dt { color: var(--teal-dim); }
.kv dd { margin: 0; font-family: var(--font-mono); }

/* Deck */
.deck { position: absolute; inset: 0; display: grid; grid-template-columns: 150px 1fr; }
.tools { border-right: 1px solid var(--os-line); padding: 12px 8px; display: grid; gap: 4px; align-content: start; background: var(--os-panel); }
.tool { text-align: left; background: none; border: 1px solid transparent; border-radius: 4px; padding: 9px 10px; cursor: pointer; color: var(--teal-text); font: 600 13px var(--font-ui); display: flex; justify-content: space-between; align-items: center; }
.tool small { font: 10px var(--font-mono); color: var(--teal-dim); }
.tool:hover:not(:disabled) { border-color: var(--os-line); }
.tool.on { border-color: var(--teal); background: rgba(140, 242, 217, 0.06); }
.tool:disabled { opacity: 0.4; cursor: default; }
.tools .who { margin-top: 18px; font: 11px var(--font-mono); color: var(--teal-dim); line-height: 1.6; }
.map { position: absolute; inset: 0; }
.map svg { width: 100%; height: 100%; display: block; }
.node { cursor: pointer; }
.node .lbl { font: 11px var(--font-mono); fill: var(--teal-text); }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes march { to { stroke-dashoffset: -22; } }
.scanbox { animation: blink 1s ease-in-out infinite; }
.scanlink { stroke-dasharray: 6 5; animation: march 0.6s linear infinite; }
.inv { display: grid; grid-template-columns: repeat(4, 64px); gap: 6px; }
.slot { width: 64px; height: 64px; border: 1px solid var(--line); background: var(--cell); border-radius: 4px; position: relative; display: grid; place-items: center; color: var(--caption); cursor: pointer; }
.slot.on { border-color: var(--amber); color: var(--amber); }
.slot .n { position: absolute; right: 4px; bottom: 2px; font: 600 12px var(--font-mono); color: var(--fg); }
.node text { font: 11px var(--font-mono); fill: var(--teal-text); }
.node .addr { fill: var(--teal-dim); font-size: 10px; }
.menu { position: absolute; z-index: 20; width: 300px; background: #061413; border: 1px solid var(--teal); border-radius: 6px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); font-size: 13px; }
.menu h4 { margin: 0 0 6px; font: 600 14px var(--font-head); color: var(--teal); }
.menu .acc { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--os-line); font-family: var(--font-mono); font-size: 12px; }
.ice { display: grid; gap: 14px; max-width: 760px; }
.pw { display: flex; gap: 6px; }
.pw span { width: 34px; height: 44px; display: grid; place-items: center; border: 1px solid var(--os-line); background: #031010; font: 600 20px var(--font-mono); color: var(--teal-dim); }
.pw span.lock { color: var(--teal); border-color: var(--teal); }
.prog { height: 10px; background: #031010; border: 1px solid var(--os-line); position: relative; max-width: 520px; }
.prog > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); }
</style>

<div class="mockbar">
  <strong>Hacking fixes · M12b playtest</strong>
  <button type="button" id="mPc">Office PC 2</button>
  <button type="button" id="mConsole">Security console</button>
  <button type="button" id="mDeck">Deck on the office wall jack</button>

</div>

<div class="frame-wrap" id="wrap">
  <div class="frame" id="frame" tabindex="0" aria-label="Game view">
    <div class="world" aria-hidden="true"><div class="wall"></div><div class="guard"></div></div>
    <div class="dim"></div>
    <div class="shell" id="shell"></div>

  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const TIERS = ["Untrained", "Trained", "Advanced", "Master"];

  // ---------- Icons (one per device kind) ----------
  const ICON = {
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="13" height="9" rx="1.5"/><path d="M16 10l5-3v9l-5-3z"/><path d="M8 16v4h5"/></svg>',

    siren: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10v4h3l5 4V6L7 10z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></svg>',

  // ---------- Example content (warehouse, M12a) ----------
  const COMPUTERS = {

    if (c === "disable" || c === "disarm") dv.disabled = true; if (c === "enable" || c === "arm") dv.disabled = false;
    if (c.startsWith("t_")) dv.target = { t_intruders: "Intruders", t_guards: "Guards", t_everyone: "Everyone" }[c];
    if (c === "open") dv.open = true; if (c === "close") dv.open = false; if (c === "unlock") dv.locked = false; if (c === "lock") dv.locked = true;
    if (c === "trigger") dv.ringing = true; if (c === "reset") dv.ringing = false;
    toast(`${dv.name}: ${msg}`);
  }

  // ---------- Live: Icebreaker progress and trace drain ----------
  let last = performance.now();
  setInterval(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now; let dirty = false;
    for (const key of Object.keys(S.scans)) { S.scans[key] = Math.min(1, S.scans[key] + dt / 2); addTrace(10 * dt / 2); dirty = true;
      if (S.scans[key] >= 1) { delete S.scans[key]; S.scanned[key] = true; toast(`${SUBNETS[key].name} subnet scanned`); } }
    if (S.xrun) { S.xrun.p = Math.min(1, S.xrun.p + dt / 4); addTrace(10 * dt / 4); dirty = true;
      if (S.xrun.p >= 1) { const n = NET.find((q) => q.id === S.xtarget); const watched = n.net === "office" || n.net === "security";
        S.cracked[n.id + "|exploit"] = true; if (watched) S.burned[S.xrun.id + "|" + n.net] = true;
        toast(`${S.xrun.name}: ${S.xrun.grants} access on ${n.label.split(" ")[0]}` + (watched ? " · detected by Sentry: patched on this subnet" : "")); S.xrun = null; } }
    if (S.mode === "ap" && S.apRun && !S.apDone) { const range = [8, 12, 18, 25][S.skill]; const ok = Number($("mDist").value) <= range && $("mLos").checked;
      if (ok) { S.apP = Math.min(1, S.apP + dt / (10 * [1, 0.75, 0.5, 0.3][S.skill])); if (S.apP >= 1) { S.apDone = true; S.apRun = false; toast("Wi-Fi key cracked"); } }
      dirty = true; }
    const I = S.ice;
    if (I && I.run && !I.done) {
      const total = BASE[I.strength] * MULT[S.skill]; I.p = Math.min(1, I.p + dt / total);
      I.locked = Math.floor(I.p * I.password.length); addTrace(4 * dt / [1, 0.8, 0.6, 0.4][S.skill] * [1, 0.8, 0.6, 0.4][S.skill]);
      if (I.p >= 1) { I.done = true; I.run = false; I.locked = I.password.length; S.cracked[I.node + "|" + I.account] = true; startScans(I.node);
        toast(NET.find((q) => q.id === I.node).gateway ? "Router hacked: scanning the subnets behind it" : `Cracked ${I.account}: added to the Journal`); }
      dirty = true;
    } else if (S.trace > 0 && now - S.lastGain > 2000) { S.trace = Math.max(0, S.trace - 10 * dt); dirty = true; }
    if (dirty && !document.activeElement?.matches?.("input")) render();
  }, 200);

  // ---------- Mockbar ----------
  $("mPc").addEventListener("click", () => reset("pc2"));
  $("mConsole").addEventListener("click", () => reset("console"));
  $("mDeck").addEventListener("click", () => reset("deck"));
  $("mAp").addEventListener("click", () => reset("ap"));
  $("mLos").addEventListener("change", () => render());
  $("mDist").addEventListener("change", () => render());
  $("mReset").addEventListener("click", () => reset(S.mode === "inv" ? "deck" : S.mode));
  $("mInv").addEventListener("click", () => { S.mode = S.mode === "inv" ? "deck" : "inv"; render(); });
  $("mCam").addEventListener("change", () => { S.inv.camera = Number($("mCam").value); render(); });
  $("mRtr").addEventListener("change", () => { S.inv.router = Number($("mRtr").value); render(); });
  $("mSkill").addEventListener("change", () => { S.skill = Number($("mSkill").value); render(); });

  function scale() { return $("wrap").clientWidth / 1280; }
  function fit() { frame.style.transform = `scale(${scale()})`; }
  new ResizeObserver(fit).observe($("wrap")); fit();
  reset("deck");
})();
</script>
