<meta charset="utf-8">
<title>Tab Interface</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a 1280x720 game frame scaled to fit; the Tab interface is an 85% panel over the dimmed,
   still-running world. Palette from the game's inventory, belt, HUD and energy colours. */
:root {
  color-scheme: dark;
  --page: #07090b;
  --world-a: #1a2026;
  --world-b: #0b0e11;
  --panel: rgba(13, 18, 21, 0.94);
  --panel-2: #12191d;
  --cell: #0f1417;
  --line: rgba(140, 158, 168, 0.35);
  --line-strong: rgba(140, 158, 168, 0.6);
  --fg: #e4eaee;
  --caption: #9eb8c2;
  --dim: #66808a;
  --amber: #ffd14d;
  --energy: #4dbfff;
  --ok: #4fd36a;
  --warn: #e8c547;
  --bad: #e5534b;
  --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--page); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.mockbar { width: 100%; max-width: 1280px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--caption); font-size: 12px; }
.mockbar strong { color: var(--fg); font-family: var(--font-head); font-size: 14px; margin-right: 6px; }
.mockbar button { font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.mockbar button:hover { border-color: var(--amber); }
.mockbar .sep { flex: 1; }
.frame-wrap { width: 100%; max-width: 1280px; position: relative; }
.frame-wrap::before { content: ""; display: block; padding-top: 56.25%; }
.frame { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; outline: none; }
.frame:focus-visible { border-color: var(--amber); }

/* The world (a stand-in for the running game view) */
.world { position: absolute; inset: 0; background:
  radial-gradient(ellipse at 50% 30%, rgba(255, 220, 160, 0.10), transparent 45%),
  linear-gradient(180deg, var(--world-a) 0%, #14191e 55%, var(--world-b) 56%, #101418 100%); }
.world .wall { position: absolute; left: 0; right: 0; top: 18%; height: 38%; background:
  repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 120px),
  repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 60px); }
.world .lamp { position: absolute; left: 47%; top: 6%; width: 70px; height: 14px; background: #ffe7b0; border-radius: 0 0 40px 40px; box-shadow: 0 0 60px 20px rgba(255, 220, 150, 0.25); }
.world .crate { position: absolute; bottom: 26%; width: 120px; height: 90px; background: #3b2c1c; border: 2px solid #261a10; }
.world .guard { position: absolute; bottom: 30%; width: 34px; height: 110px; left: -60px; animation: patrol 18s linear infinite; }
.world .guard::before { content: ""; position: absolute; left: 6px; top: 0; width: 22px; height: 22px; background: #c79d78; border-radius: 3px; }
.world .guard::after { content: ""; position: absolute; left: 0; top: 24px; width: 34px; height: 86px; background: #1d2e52; border-radius: 3px; }
@keyframes patrol { 0% { left: -60px; } 50% { left: 1300px; } 50.01% { left: 1300px; } 100% { left: -60px; } }
@media (prefers-reduced-motion: reduce) { .world .guard { animation: none; left: 70%; } }
.dim { position: absolute; inset: 0; background: rgba(4, 6, 8, 0.55); transition: opacity 0.15s; }
.hitflash { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 rgba(229, 83, 75, 0); transition: box-shadow 0.35s ease-out; }
.hitflash.on { box-shadow: inset 0 0 120px 30px rgba(229, 83, 75, 0.55); transition: none; }

/* HUD (shown when the interface is closed) */
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud .hint { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 13px; color: var(--caption); background: rgba(0,0,0,0.45); padding: 6px 12px; border-radius: 4px; }
.hud .belt { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.slot { width: 52px; height: 52px; border: 1px solid var(--line-strong); background: rgba(10, 12, 14, 0.6); position: relative; font-family: var(--font-mono); font-size: 10px; color: var(--caption); }
.slot .n { position: absolute; left: 4px; top: 2px; }
.slot .label { position: absolute; inset: 14px 3px 3px; display: grid; place-items: center; color: #f3f3ec; font-weight: 600; font-size: 9px; text-align: center; }
.slot.sel { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.hud .energy { position: absolute; left: 24px; bottom: 214px; display: flex; gap: 8px; align-items: center; }
.bar { height: 8px; width: 120px; background: rgba(5, 8, 12, 0.7); border: 1px solid rgba(0,0,0,0.7); position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--energy); }
.hud .body { position: absolute; left: 24px; bottom: 24px; }

/* The Tab interface panel: 85 % of the frame */
.ui { position: absolute; left: 7.5%; top: 7.5%; width: 85%; height: 85%; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; display: grid; grid-template-rows: auto 1fr; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.tab { font: 600 14px var(--font-head); color: var(--caption); background: transparent; border: 0; border-right: 1px solid var(--line); padding: 12px 20px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; letter-spacing: 0.02em; }
.tab .k { font: 600 11px var(--font-mono); color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--fg); background: linear-gradient(180deg, rgba(255, 209, 77, 0.10), transparent); box-shadow: inset 0 -2px 0 var(--amber); }
.tab.on .k { color: var(--amber); border-color: var(--amber); }
.close-btn { margin-left: auto; width: 46px; font: 600 16px var(--font-ui); color: var(--caption); background: transparent; border: 0; border-left: 1px solid var(--line); cursor: pointer; }
.close-btn:hover { color: var(--bad); background: rgba(229, 83, 75, 0.08); }
.tabs .status { margin-left: auto; display: flex; align-items: center; gap: 14px; padding: 0 16px; font: 12px var(--font-mono); color: var(--caption); }
.live { display: inline-flex; gap: 6px; align-items: center; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.content { min-height: 0; overflow: hidden; }
.foot { border-top: 1px solid var(--line); padding: 8px 16px; font: 11px var(--font-mono); color: var(--dim); display: flex; gap: 18px; flex-wrap: wrap; }
.foot b { color: var(--caption); font-weight: 600; }

.pane { display: grid; height: 100%; min-height: 0; }
.col { min-height: 0; overflow: auto; padding: 18px 20px; }
.col + .col { border-left: 1px solid var(--line); }
h2 { font: 700 18px var(--font-head); margin: 0 0 4px; letter-spacing: 0.01em; text-wrap: balance; }
h3 { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--caption); margin: 18px 0 8px; }
h3:first-child { margin-top: 0; }
p { margin: 0 0 10px; line-height: 1.5; max-width: 62ch; }
.muted { color: var(--caption); }
.future { color: var(--dim); font-size: 12px; border: 1px dashed var(--line); border-radius: 4px; padding: 6px 10px; }
.btn { font: 600 12px var(--font-ui); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { border-color: var(--amber); color: var(--amber); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--caption); }
.kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: var(--fg); font: 13px var(--font-mono); padding: 6px 14px; border-radius: 4px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.on { opacity: 1; }

/* Inventory */
.inv { grid-template-columns: 470px 1fr; }
.grid { position: relative; width: 386px; height: 322px; background-color: var(--cell);
  background-image: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 64px), repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 64px);
  border: 1px solid var(--line-strong); }
.item { position: absolute; border: 1px solid rgba(0,0,0,0.6); display: grid; place-items: center; cursor: pointer; font: 600 11px var(--font-mono); color: #f5f5ee; text-shadow: 0 1px 2px #000; }
.item .cnt { position: absolute; right: 4px; bottom: 2px; color: #ffeb8c; font-size: 11px; }
.item .tag { position: absolute; left: 4px; top: 2px; color: #8cd9ff; font-size: 9px; }
.item.sel { outline: 2px solid var(--amber); outline-offset: -2px; z-index: 2; }
.belt-row { display: flex; gap: 4px; margin-top: 12px; }
.belt-row .slot { width: 40px; height: 40px; }
.belt-row .slot .label { inset: 12px 2px 2px; font-size: 8px; }
.detail .icon { width: 128px; height: 64px; display: grid; place-items: center; font: 600 13px var(--font-mono); border: 1px solid rgba(0,0,0,0.6); margin-bottom: 12px; text-shadow: 0 1px 2px #000; }
.menu { position: absolute; z-index: 20; background: #0b0f12; border: 1px solid var(--line-strong); border-radius: 4px; padding: 4px; min-width: 150px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
.menu button { display: block; width: 100%; text-align: left; font: 13px var(--font-ui); color: var(--fg); background: none; border: 0; padding: 6px 10px; cursor: pointer; border-radius: 3px; }
.menu button:hover { background: rgba(255, 209, 77, 0.12); color: var(--amber); }
select.btn { padding: 6px 8px; }

/* Health */
.health { grid-template-columns: 330px 1fr; }
.body-svg rect { stroke: rgba(0,0,0,0.75); stroke-width: 2; cursor: pointer; }
.body-svg rect.sel { stroke: var(--amber); stroke-width: 3; }
.parts { display: grid; gap: 8px; }
.part { display: grid; grid-template-columns: 110px 1fr 70px; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
.part:hover { border-color: var(--line); }
.part.sel { border-color: var(--amber); background: rgba(255, 209, 77, 0.05); }
.hbar { height: 10px; background: #0a0d10; border: 1px solid rgba(0,0,0,0.7); position: relative; }
.hbar > i { position: absolute; left: 0; top: 0; bottom: 0; }
.num { font: 12px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--caption); }
.effect { font-size: 12px; color: var(--caption); grid-column: 1 / -1; margin-top: -4px; }
.effect.active { color: var(--bad); }

/* Augmentations */
.augs { grid-template-columns: 1fr; }
.aug-list { display: grid; gap: 10px; }
.aug { display: grid; grid-template-columns: 52px 1fr 180px; gap: 16px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; }
.aug .key { font: 600 14px var(--font-mono); color: var(--caption); border: 1px solid var(--line-strong); border-radius: 4px; text-align: center; padding: 8px 0; }
.aug.on { border-color: var(--energy); background: rgba(77, 191, 255, 0.06); }
.aug.on .key { color: var(--energy); border-color: var(--energy); }
.aug.off-limits { opacity: 0.45; }
.aug .name { font: 600 15px var(--font-head); }
.aug .desc { color: var(--caption); font-size: 13px; margin-top: 2px; }
.aug .side { display: grid; gap: 6px; justify-items: end; font: 12px var(--font-mono); color: var(--caption); }
.switch { width: 54px; height: 26px; border-radius: 13px; border: 1px solid var(--line-strong); background: #0a0d10; position: relative; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--dim); transition: left 0.15s, background 0.15s; }
.switch.on { border-color: var(--energy); }
.switch.on::after { left: 31px; background: var(--energy); }
.energy-big { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; font: 13px var(--font-mono); color: var(--caption); }
.energy-big .bar { width: 320px; height: 14px; }

/* Skills */
.skills { grid-template-columns: 1fr 1fr; }
.skill-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 9px 10px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
.skill-row:hover { border-color: var(--line); }
.skill-row.sel { border-color: var(--amber); background: rgba(255, 209, 77, 0.05); }
.skill-row .nm { font: 600 14px var(--font-head); }
.pips { display: flex; gap: 4px; }
.pips i { width: 22px; height: 8px; background: #0a0d10; border: 1px solid var(--line-strong); }
.pips i.on { background: var(--amber); border-color: var(--amber); }
.tier { font: 12px var(--font-mono); color: var(--caption); width: 72px; text-align: right; }
.testbtns { display: flex; gap: 4px; align-items: center; }
.testbtns .btn { padding: 2px 8px; }
.testtag { font: 600 9px var(--font-mono); letter-spacing: 0.1em; color: var(--warn); border: 1px solid var(--warn); border-radius: 3px; padding: 1px 5px; }
table.tiers { border-collapse: collapse; width: 100%; font-size: 12px; }
table.tiers th, table.tiers td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
table.tiers th { font: 600 11px var(--font-mono); color: var(--caption); letter-spacing: 0.06em; }
table.tiers td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
table.tiers td:first-child { font-family: var(--font-ui); color: var(--caption); }
table.tiers .cur { color: var(--amber); background: rgba(255, 209, 77, 0.06); }

/* Journal */
.journal { grid-template-columns: 200px 300px 1fr; }
.side-nav { display: grid; gap: 4px; align-content: start; }
.side-nav button { text-align: left; font: 600 13px var(--font-ui); color: var(--caption); background: none; border: 1px solid transparent; border-radius: 4px; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; }
.side-nav button.on { color: var(--fg); border-color: var(--amber); background: rgba(255, 209, 77, 0.05); }
.side-nav .c { font: 11px var(--font-mono); color: var(--dim); }
.list { display: grid; gap: 4px; align-content: start; }
.list button { text-align: left; background: none; border: 1px solid transparent; border-radius: 4px; padding: 8px 10px; cursor: pointer; color: var(--fg); font: 13px var(--font-ui); display: grid; gap: 2px; }
.list button:hover { border-color: var(--line); }
.list button.on { border-color: var(--amber); background: rgba(255, 209, 77, 0.05); }
.list small { color: var(--dim); font: 11px var(--font-mono); }
.obj { border-left: 3px solid var(--line-strong); padding: 6px 0 6px 12px; margin-bottom: 14px; }
.obj.primary { border-left-color: var(--amber); }
.obj.done { border-left-color: var(--ok); }
.obj .t { font: 600 14px var(--font-head); display: flex; gap: 8px; align-items: center; }
.pill { font: 600 10px var(--font-mono); letter-spacing: 0.08em; border-radius: 3px; padding: 1px 6px; border: 1px solid currentColor; }
.pill.p { color: var(--amber); } .pill.s { color: var(--caption); } .pill.d { color: var(--ok); }
table.codes { border-collapse: collapse; width: 100%; font-size: 13px; }
table.codes th, table.codes td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; }
table.codes th { font: 600 11px var(--font-mono); color: var(--caption); letter-spacing: 0.06em; }
table.codes td.code { font-family: var(--font-mono); color: var(--amber); }
.note-text { font-size: 14px; line-height: 1.6; background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; max-width: 62ch; }
.learned { margin-top: 12px; font: 12px var(--font-mono); color: var(--caption); }
.learned b { color: var(--amber); font-weight: 600; }
.notes-wide { grid-template-columns: 200px 1fr; }
</style>

<div class="mockbar">
  <strong>Tab Interface</strong>
  <span>Mockup of M11. Click the game view first, then use the game's keys: Tab, I, L, Esc, 1–5, Q / E.</span>
  <span class="sep"></span>
  <button type="button" id="mHit">Simulate a hit</button>
  <button type="button" id="mToggle">Open / close (Tab)</button>
  <button type="button" id="mReset">Reset</button>
</div>

<div class="frame-wrap" id="wrap">
  <div class="frame" id="frame" tabindex="0" aria-label="Game view">
    <div class="world" aria-hidden="true">
      <div class="wall"></div><div class="lamp"></div>
      <div class="crate" style="left: 140px"></div><div class="crate" style="left: 270px; height: 70px"></div><div class="crate" style="right: 180px; width: 160px"></div>
      <div class="guard"></div>
    </div>
    <div class="dim" id="dim"></div>
    <div class="hud" id="hud">
      <div class="hint">Tab: interface · I: inventory · L: journal</div>
      <div class="energy"><div class="bar"><i id="hudEnergy"></i></div><span id="hudEnergyNum" style="font: 12px var(--font-mono); color: var(--caption)"></span></div>
      <div class="body" id="hudBody"></div>
      <div class="belt" id="hudBelt"></div>
    </div>
    <div class="ui" id="ui" hidden>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="content" id="content"></div>
    </div>
    <div class="hitflash" id="flash"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const rgb = (c) => `rgb(${c.map((v) => Math.round(v * 255)).join(",")})`;

  // ---------- Game data (from the project) ----------
  const ITEMS = {
    pistol: { name: "Pistol", short: "PISTOL", w: 2, h: 1, col: [.36, .40, .48], kind: "weapon",
      desc: "10 mm sidearm. Accurate at rest, loud: guards hear a shot about 25 m away. Takes a silencer on its muzzle. Holds a 10-round magazine; reloads from pistol ammo.",
      stats: [["Damage", "25 ballistic (head x2)"], ["Magazine", "8 / 10"], ["Ammo", "10MM, 10 carried"], ["Heard to", "about 25 m"], ["Muzzle", "empty: a silencer fits"], ["Skill", "Pistols"]], ammo: true },
    rifle: { name: "Assault rifle", short: "RIFLE", w: 2, h: 2, col: [.30, .55, .45], kind: "weapon",
      desc: "Automatic rifle: hold LMB to keep firing; the spread grows with every shot and recovers when you stop. Holds 30 rounds; reloads from rifle rounds. Takes a silencer.",
      stats: [["Damage", "14 ballistic a round"], ["Magazine", "21 / 30"], ["Ammo", "5.56, 24 carried"], ["Heard to", "about 28 m"], ["Muzzle", "empty: a silencer fits"], ["Skill", "Rifles"]], ammo: true },
    baton: { name: "Stun baton", short: "BATON", w: 1, h: 3, col: [.30, .42, .75], kind: "weapon",
      desc: "Electrified baton. Non-lethal: one blow from behind knocks out an unaware target.",
      stats: [["Damage", "20 stun + 5 blunt"], ["Heard to", "about 3 m"], ["Skill", "Low-Tech"]] },
    ammo10: { name: "Pistol ammo", short: "10MM", w: 1, h: 1, col: [.72, .16, .14], kind: "ammo", desc: "Box of 10 mm rounds for the pistol. Reloading takes them from here.", stats: [["Count", "10 / 100"]] },
    ammo556: { name: "Rifle rounds", short: "5.56", w: 1, h: 1, col: [.22, .55, .22], kind: "ammo", desc: "Box of 5.56 mm rounds for the assault rifle. Reloading takes them from here.", stats: [["Count", "24 / 150"]] },
    medkit: { name: "Medkit", short: "MEDKIT", w: 1, h: 1, col: [.78, .20, .20], kind: "consumable", desc: "Restores 30 health (more with the Medicine skill), spread over the injured body parts. Refused when you are not hurt.", stats: [["Heals", "30 (Medicine: Untrained)"]] },
    pick: { name: "Lockpick", short: "PICK", w: 1, h: 1, col: [.58, .58, .62], kind: "tool", desc: "Opens mechanical locks: LMB on the lock to pick it. Breaks if forced.", stats: [["Skill", "Lockpicking"]] },
    biocell: { name: "Bioelectric cell", short: "BIOCELL", w: 1, h: 1, col: [.30, .75, .38], kind: "consumable", desc: "Restores 25 bioelectric energy for augmentations. Refused when your energy is full.", stats: [["Restores", "25 energy"]] },
    keycard: { name: "Keycard", short: "KEYCARD", w: 1, h: 1, col: [.85, .75, .25], kind: "key", desc: "Opens doors that accept its key.", stats: [["Opens", "Vault"]], tag: "VAULT" },
    proto: { name: "Prototype", short: "PROTO", w: 2, h: 1, col: [.20, .85, .95], kind: "quest", desc: "A sealed case with a glowing core: the device the company is shipping out. Someone will pay well for it.", stats: [["Objective", "Take the prototype from the vault"]] },
  };
  const START_INV = [

  // ---------- State ----------
  let S;

  // ---------- Helpers ----------
  const stack = (id) => S.inv.find((s) => s.id === id);

  let toastT = 0;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }
  const drain = () => AUGS.filter((a) => S.augOn[a.key]).reduce((s, a) => s + a.drain, 0);
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  // ---------- Open / close and tabs ----------
  function open(tab) { S.open = true; S.tab = tab || S.lastTab; S.lastTab = S.tab; S.menu = null; render(); }
  function close() { if (S.open) S.lastTab = S.tab; S.open = false; S.menu = null; render(); }
  function shortcut(tab) { if (!S.open) open(tab); else if (S.tab === tab) close(); else setTab(tab); }
  function setTab(tab) { S.tab = tab; S.lastTab = tab; S.menu = null; render(); }
  function step(d) { const i = TABS.findIndex((t) => t.id === S.tab); setTab(TABS[(i + d + TABS.length) % TABS.length].id); }

  // ---------- Rendering ----------
  function render() {
    $("ui").hidden = !S.open; $("hud").hidden = S.open;
    $("dim").style.opacity = S.open ? "1" : "0";
    renderHud();
    if (!S.open) return;
    $("tabs").innerHTML = TABS.map((t, i) =>
      `<button type="button" role="tab" class="tab${t.id === S.tab ? " on" : ""}" data-tab="${t.id}" aria-selected="${t.id === S.tab}">${t.name}</button>`).join("") +

    const r = { inventory: renderInventory, health: renderHealth, augs: renderAugs, skills: renderSkills, journal: renderJournal }[S.tab];

  function bodySvg(scale, interactive) {
    const B = { head: [36, 0, 28, 28], torso: [28, 32, 44, 58], arm_l: [8, 32, 16, 56], arm_r: [76, 32, 16, 56], leg_l: [30, 94, 18, 66], leg_r: [52, 94, 18, 66] };
    const rects = PARTS.map((p) => { const [x, y, w, h] = B[p.id]; const r = S.hp[p.id] / p.max;
      return `<rect data-part="${interactive ? p.id : ""}" class="${interactive && S.part === p.id ? "sel" : ""}" x="${x}" y="${y}" width="${w}" height="${h}" fill="${hpColor(r)}"><title>${p.name}: ${S.hp[p.id]} / ${p.max}</title></rect>`; }).join("");
    return `<svg class="body-svg" width="${100 * scale}" height="${160 * scale}" viewBox="-2 -2 104 166" aria-label="Body health">${rects}</svg>`;
  }
  function renderHud() {
    $("hudEnergy").style.width = `${S.energy}%`; $("hudEnergyNum").textContent = Math.round(S.energy);

  }

  function renderInventory() {
    const cells = S.inv.map((s) => { const it = ITEMS[s.id];
      return `<div class="item${S.sel === s.id ? " sel" : ""}" data-item="${s.id}" style="left:${s.x * 64}px;top:${s.y * 64}px;width:${it.w * 64}px;height:${it.h * 64}px;background:${rgb(it.col)}">${it.short}${it.tag ? `<span class="tag">${it.tag}</span>` : ""}${s.n > 1 ? `<span class="cnt">${s.n}</span>` : ""}</div>`; }).join("");

  function renderHealth() {

  // ---------- Actions ----------
  function healPart(id, amount) { const p = PARTS.find((q) => q.id === id); const before = S.hp[id]; S.hp[id] = clamp(S.hp[id] + amount, 0, p.max); return S.hp[id] - before; }
  function useMedkit(all) {
    const st = stack("medkit"); if (!st) { toast("No medkits"); return; }
    let healed = 0;
    if (all) {
      let left = medicineHeal();
      for (let pass = 0; pass < 6 && left > 0.5; pass++) {
        const hurt = PARTS.filter((q) => S.hp[q.id] < q.max); if (!hurt.length) break;
        const share = left / hurt.length; let used = 0;
        for (const q of hurt) used += healPart(q.id, Math.round(share));
        left -= used; healed += used; if (!used) break;
      }
    } else healed = healPart(S.part, medicineHeal());
    if (!healed) { toast("You are not hurt"); return; }
    st.n -= 1; if (st.n <= 0) { S.inv = S.inv.filter((s) => s !== st); S.belt = S.belt.map((b) => (b === "medkit" ? null : b)); }
    toast(`Healed ${healed}`); render();
  }
  function itemAction(act, id) {
    const it = ITEMS[id];
    if (act === "use") {
      if (id === "medkit") { S.tab = "health"; toast("Choose a body part, or Heal all"); render(); return; }
      if (id === "biocell") { if (S.energy >= 100) { toast("Energy full"); return; } S.energy = Math.min(100, S.energy + 25); const st = stack(id); st.n -= 1; if (!st.n) S.inv = S.inv.filter((s) => s !== st); toast("+25 energy"); render(); return; }
      toast(`${it.name} in hand`);
    } else if (act === "drop") {
      S.inv = S.inv.filter((s) => s.id !== id); S.belt = S.belt.map((b) => (b === id ? null : b)); S.sel = S.inv[0] ? S.inv[0].id : null; toast(`Dropped: ${it.name}`); render();
    } else if (act === "belt") {
      if (S.belt.includes(id)) { toast("Already on the belt"); return; }
      const i = S.belt.indexOf(null); if (i < 0) { toast("The belt is full"); return; } S.belt[i] = id; toast(`On belt slot ${(i + 1) % 10}`); render();
    }
  }
  function hit() {
    const p = PARTS[Math.floor(Math.random() * PARTS.length)];
    S.hp[p.id] = Math.max(p.id === "head" || p.id === "torso" ? 1 : 0, S.hp[p.id] - 12);
    const f = $("flash"); f.classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove("on")));
    render();
  }

  // ---------- Input ----------
  const frame = $("frame");
  frame.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab],[data-item],[data-part],[data-act],[data-aug],[data-skill],[data-jsec],[data-note]");
    if (S.menu && !e.target.closest(".menu")) { S.menu = null; if (!t) { render(); return; } }
    if (!t) return;
    if (t.dataset.tab) setTab(t.dataset.tab);
    else if (t.dataset.item) { S.sel = t.dataset.item; S.menu = null; render(); }
    else if (t.dataset.part) { S.part = t.dataset.part; render(); }
    else if (t.dataset.aug) { const k = t.dataset.aug; if (!S.augOn[k] && S.energy <= 0) { toast("Energy depleted"); return; } S.augOn[k] = !S.augOn[k]; render(); }
    else if (t.dataset.skill) { S.skill = Number(t.dataset.skill); render(); }
    else if (t.dataset.jsec) { S.jsec = t.dataset.jsec; render(); }
    else if (t.dataset.note) { e.preventDefault(); S.jsec = "notes"; S.note = t.dataset.note; render(); }
    else if (t.dataset.act) {
      const a = t.dataset.act;
      if (a === "close") close();
      else if (a === "healpart") useMedkit(false); else if (a === "healall") useMedkit(true);
      else if (a === "tierup" || a === "tierdown") { S.skills[S.skill] = clamp(S.skills[S.skill] + (a === "tierup" ? 1 : -1), 0, 3); render(); }
      else { const id = S.menu ? S.menu.id : S.sel; S.menu = null; itemAction(a, id); }
    }
  });
  frame.addEventListener("contextmenu", (e) => {
    const t = e.target.closest("[data-item]"); if (!t) return;
    e.preventDefault(); const col = t.closest(".col").getBoundingClientRect(); const k = scale();
    S.sel = t.dataset.item; S.menu = { id: t.dataset.item, x: (e.clientX - col.left) / k, y: (e.clientY - col.top) / k }; render();
  });
  frame.addEventListener("change", (e) => {
    if (e.target.id !== "beltSel") return;
    const i = Number(e.target.value); S.belt = S.belt.map((b) => (b === S.sel ? null : b)); if (i >= 0) S.belt[i] = S.sel; render();
  });
  frame.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    const k = e.key;
    if (k === "Tab") { e.preventDefault(); S.open ? close() : open(); return; }
    if (k === "Escape") { e.preventDefault(); if (S.open) close(); else toast("Esc: the game menu (it pauses)"); return; }
    const lk = k.toLowerCase();
    if (lk === "i") { shortcut("inventory"); return; }
    if (lk === "l") { shortcut("journal"); return; }
    if (!S.open) return;
    if (/^[1-5]$/.test(k)) setTab(TABS[Number(k) - 1].id);
    else if (lk === "q") step(-1); else if (lk === "e") step(1);
  });
  $("mHit").addEventListener("click", () => { hit(); frame.focus(); });
  $("mToggle").addEventListener("click", () => { S.open ? close() : open(); frame.focus(); });
  $("mReset").addEventListener("click", () => { reset(); render(); frame.focus(); });

  // ---------- Live world: clock and energy drain ----------
  let acc = 0;
  setInterval(() => {
    S.clock += 1;
    const d = drain();
    if (d > 0) { S.energy = Math.max(0, S.energy - d); if (S.energy <= 0) { for (const k in S.augOn) S.augOn[k] = false; toast("Energy depleted"); } render(); }
    else { const c = $("clock"); if (c) c.textContent = mmss(S.clock); }
  }, 1000);

  // ---------- Fit the 1280x720 frame to the width ----------
  function scale() { return $("wrap").clientWidth / 1280; }
  function fit() { frame.style.transform = `scale(${scale()})`; }
  new ResizeObserver(fit).observe($("wrap")); fit();

  open("inventory");
  frame.focus({ preventScroll: true });
})();
</script>
